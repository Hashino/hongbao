<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hongbao 拼手气 — Chain Jam Vol. 1</title>
<meta name="description" content="Six red envelopes hold a lucky split of the dragon's pot. One of them is white." />
<link rel="stylesheet" href="./css/hongbao.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='0' fill='%237a1220'/><rect x='34' y='36' width='32' height='32' fill='%23e8c26a'/></svg>" />
</head>
<body>

<!-- ============================ interface ============================ -->
<header class="hud top">
  <div class="hud-inner">
    <div class="wordmark">
      <b>Hongbao</b>
      <span>拼手气</span>
    </div>

    <div class="readouts">
      <div class="readout">
        <label>Dragon's pot</label>
        <div class="value" id="pot">&mdash;</div>
      </div>
    </div>

    <div class="chips">
      <span class="chip" id="mode-chip">demo</span>
      <span class="socket"><button class="icon" id="mute" title="Sound on/off" aria-label="Sound on/off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3.5L12 4.5v15L7.5 15H4z"/><path d="M15.5 8.8a4.4 4.4 0 0 1 0 6.4M18 6a8 8 0 0 1 0 12" fill="none"/></svg></button></span>
    </div>
  </div>
</header>

<!-- ============================== the table ============================== -->
<main class="felt">
  <div class="surface">
    <!-- the inlaid playing panel everything physically rests on -->
    <div class="mat">
      <!-- the well cut into the far side of the tabletop: the dragon's money -->
      <div class="well far"></div>

      <div class="table" id="table"></div>

      <!-- and the one cut into the near side, which is where yours ends up -->
      <div class="well near"></div>
    </div>
  </div>
</main>

<!-- ============================ interface ============================ -->
<footer class="hud bottom">
  <div class="hud-inner">
    <div class="message" id="message">
      Six envelopes, one lucky split. Five are red. One is <span class="zh">white</span>.
    </div>

    <div class="wager" id="wager-row">
      <label for="wager">Wager</label>
      <input id="wager" type="text" inputmode="decimal" value="10" />
      <div class="presets">
        <button data-w="1">1</button>
        <button data-w="10">10</button>
        <button data-w="50">50</button>
        <button data-w="100">100</button>
      </div>
    </div>

    <div class="controls" id="controls"></div>

    <div class="keys">
      <span><kbd>Space</kbd> flip</span>
      <span><kbd>Tab</kbd> keep</span>
    </div>

    <div class="fineprint">
      <span>RTP <b>94.7%</b> &middot; max <b>9&times;</b> &middot; 白包 pays nothing</span>
    </div>
  </div>
</footer>

<script type="module" src="./js/game.js"></script>
<script async src="https://jam.chain.wtf/widget.js"></script>
</body>
</html>
